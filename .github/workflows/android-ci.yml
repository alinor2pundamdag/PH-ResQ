name: Android CI
on:
  push:
    branches:
      - arena/a59820fa-ph-resq
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -d /usr/local/lib/android/sdk/platforms/android-35
          test -d /usr/local/lib/android/sdk/build-tools/35.0.0
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace > build.log 2>&1 || {
            tail -65 build.log
            grep -E '(^.*error:|^FAILURE:|^\* What went wrong:|^Execution failed|^> )' build.log | tail -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
