name: Android CI
on:
  push:
    branches: [main, "docs/architecture-correction-2026-10-27"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install and verify Android 16 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Android lint
        run: gradle lintDebug --console=plain
      - name: Run unit tests
        run: gradle testDebugUnitTest --console=plain --stacktrace
      - name: Assemble debug APK
        run: gradle assembleDebug --console=plain
      - name: Assemble release APK
        run: gradle assembleRelease --console=plain
      - name: Write build evidence
        if: success()
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/evidence
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_COMMIT" = "$SOURCE_COMMIT"
          printf 'source_commit=%s\nchecked_out_commit=%s\nrun_id=%s\nrun_attempt=%s\nrelease_variant=unsigned\n' "$SOURCE_COMMIT" "$CHECKED_OUT_COMMIT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > build/evidence/BUILD_METADATA.txt
          mkdir -p build/distributions
          cp app/build/outputs/apk/debug/app-debug.apk build/distributions/PH-ResQ-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/distributions/PH-ResQ-release-unsigned.apk
          sha256sum build/distributions/*.apk > build/evidence/SHA256SUMS
          test -s build/evidence/SHA256SUMS
      - name: Upload APKs and build evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ph-resq-apk-builds
          path: |
            build/distributions/*.apk
            build/evidence/*
          if-no-files-found: error
          retention-days: 14
