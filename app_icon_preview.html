<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH-ResQ Vanguard - App Icon Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 112px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(252,209,22,0.4);
            border: 4px solid #FCD116;
        }
        canvas {
            display: block;
            background: #002166;
        }
        .info {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="iconCanvas" width="512" height="512"></canvas>
        </div>
        <div class="info">
            <h2>PH-ResQ Vanguard App Icon</h2>
            <p>Perpekto ang geometriya ng Waving Flag, 8-Rayed Sun, 3 Stars, at Mapa ng Pilipinas.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');

        function drawAppIcon() {
            // 1. Waving Philippine Flag Background
            // Royal Blue Top Left / Diagonal gradient wave simulation
            let gradBg = ctx.createLinearGradient(0, 0, 512, 512);
            gradBg.addColorStop(0, '#0038A8');
            gradBg.addColorStop(0.5, '#002166');
            gradBg.addColorStop(1, '#CE1126');
            ctx.fillStyle = gradBg;
            ctx.fillRect(0, 0, 512, 512);

            // Crimson Red Bottom Right Wave area
            ctx.fillStyle = '#CE1126';
            ctx.beginPath();
            ctx.moveTo(512, 200);
            ctx.bezierCurveTo(350, 300, 300, 450, 512, 512);
            ctx.lineTo(512, 0);
            ctx.fill();

            // White Equilateral Triangle on Left
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(256, 256);
            ctx.lineTo(0, 512);
            ctx.closePath();
            ctx.fill();

            // 2. Philippine 8-Rayed Sun
            ctx.save();
            ctx.translate(130, 256);
            
            // Draw Sun Rays
            const rays = 8;
            for (let i = 0; i < rays; i++) {
                ctx.save();
                ctx.rotate((i * Math.PI) / 4);
                ctx.fillStyle = '#FCD116';
                ctx.beginPath();
                ctx.moveTo(0, -75);
                ctx.lineTo(10, -35);
                ctx.lineTo(-10, -35);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // Sun Core Circle
            let sunGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
            sunGrad.addColorStop(0, '#FFE600');
            sunGrad.addColorStop(1, '#FCD116');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 3. Three Golden Stars (Positioned correctly at triangle corners)
            drawStar(75, 95, 14, '#FCD116');   // Top corner
            drawStar(155, 256, 14, '#FCD116'); // Right inner corner
            drawStar(75, 417, 14, '#FCD116');  // Bottom corner

            // 4. Detailed Philippines Map Overlay (Subtle gold/white silhouette or glowing green)
            ctx.save();
            ctx.fillStyle = 'rgba(34, 197, 94, 0.75)';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.translate(220, 40);
            ctx.scale(0.7, 0.7);
            
            // Simplified precise Archipelago Vector Representation
            ctx.beginPath();
            // Luzon
            ctx.moveTo(120, 20); ctx.lineTo(150, 40); ctx.lineTo(140, 90); ctx.lineTo(180, 120);
            ctx.lineTo(160, 160); ctx.lineTo(100, 150); ctx.lineTo(80, 100); ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Visayas & Mindanao clusters
            ctx.beginPath(); ctx.arc(140, 200, 18, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(170, 250, 22, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(150, 340, 35, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            // 5. Typography: "PH-RESQ" with Flag Embedded Look
            ctx.save();
            ctx.font = '900 48px Arial Black, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Text shadow/stroke for maximum contrast
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#000000';
            ctx.strokeText('PH-RESQ', 256, 440);

            // Fill text with gradient
            let textGrad = ctx.createLinearGradient(150, 400, 350, 400);
            textGrad.addColorStop(0, '#FFE600');
            textGrad.addColorStop(0.5, '#FFFFFF');
            textGrad.addColorStop(1, '#CE1126');
            ctx.fillStyle = textGrad;
            ctx.fillText('PH-RESQ', 256, 440);
            ctx.restore();
        }

        function drawStar(cx, cy, radius, fill) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.beginPath();
            let spikes = 5;
            let outerRadius = radius;
            let innerRadius = radius / 2;
            let rot = (Math.PI / 2) * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(0, -outerRadius);
            for (let i = 0; i < spikes; i++) {
                let x = Math.cos(rot) * outerRadius;
                let y = Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = Math.cos(rot) * innerRadius;
                y = Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(0, -outerRadius);
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#B38F00';
            ctx.stroke();
            ctx.restore();
        }

        drawAppIcon();
    </script>
</body>
</html>
